name: Public tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install public test dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-tested.txt
      - name: Test
        run: python -m pytest -q
      - name: Offline pixel-contract demo
        run: python tools/run_synthetic_demo.py --out output/synthetic
      - name: Replay CLI
        run: python -m strict_compositor.cli compose --job output/synthetic/hybrid_job.json --out output/cli_hybrid
